<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit 7: Why do colors matter? - Vocabulary Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        
        /* Perspective for 3D effect */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        /* Grid Card Sizing */
        .grid-card { height: 260px; }
        
        /* Focus Card Sizing */
        .focus-card { height: 400px; max-width: 800px; margin: 0 auto; }

        /* Smooth Flip Transition */
        .flip-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .bg-gradient-front { background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const vocabData = {
            idioms: [
                { term: "See red", def: "To become very angry suddenly.", example: "I always see red when my internet disconnects right in the middle of a multiplayer match!" },
                { term: "A gray area", def: "An unclear situation where the rules aren't obvious.", example: "Using AI for homework is a bit of a gray area; some teachers allow it for ideas, while others strictly ban it." },
                { term: "Feeling blue", def: "Feeling sad or depressed.", example: "I was feeling blue after failing my math test, so my friends took me out for pizza." },
                { term: "On the black market", def: "Bought or sold illegally.", example: "He bought the sold-out concert tickets on the black market and ended up getting scammed." },
                { term: "Green with envy", def: "Very jealous of someone else's success or belongings.", example: "I was green with envy when my best friend got the newest iPhone for her birthday." },
                { term: "A white-knuckle ride", def: "A thrilling or terrifying experience.", example: "The new rollercoaster at the theme park was a total white-knuckle ride!" }
            ],
            wordFamilies: [
                { term: "Strong → Strength", def: "Having physical or mental power.", example1: "You need to be mentally strong to deal with cyberbullying.", example2: "It takes a lot of inner strength to stand up to a bully at school." },
                { term: "Possible → Possibility", def: "A chance that something might happen.", example1: "Is it possible to finish this entire group project in one night?", example2: "There's a strong possibility that our school trip will be canceled because of the storm." },
                { term: "Significant → Significance", def: "Importance or meaning.", example1: "The new eco-friendly laws will have a significant impact on how we recycle plastic.", example2: "Do you understand the significance of this exam for your college applications?" },
                { term: "Prior → Priority", def: "Something that is more important than other things.", example1: "I can't go to the movies tonight because I have a prior commitment with my study group.", example2: "My top priority this weekend is finishing my science project before I play any video games." },
                { term: "Thick → Thickness", def: "How wide or deep something is.", example1: "The fog was so thick this morning that the school bus was delayed.", example2: "The thickness of the ice on the lake isn't safe enough for skating yet." },
                { term: "Creative → Creativity", def: "The ability to invent new things or ideas.", example1: "She is incredibly creative and always designs the best posters for the school play.", example2: "You need a lot of creativity to design a viral TikTok video." },
                { term: "Sick → Sickness", def: "An illness or poor health condition.", example1: "I feel too sick to go to school today, so I'm going to rest in bed.", example2: "Because of the sudden sickness spreading in class, half the students are absent today." }
            ],
            phrasalVerbs: [
                { term: "Go through", def: "To use up a lot of something entirely.", example: "We go through so many plastic water bottles during basketball practice." },
                { term: "Dispose of", def: "To throw away correctly.", example: "Make sure you dispose of your old phone batteries in the special recycling bin." },
                { term: "Break down", def: "To separate into smaller parts or decompose.", example: "Plastic bags can take hundreds of years to break down in the ocean." },
                { term: "Build up", def: "To increase or collect over time.", example: "If we don't clean our lockers, the trash will just build up until it's a disaster." },
                { term: "Stick around", def: "To stay somewhere for a period of time.", example: "Are you going to stick around after school for the drama club meeting?" },
                { term: "Kill off", def: "To destroy a whole species or population.", example: "Chemical pollution in the river could completely kill off the local fish." },
                { term: "Cut down on", def: "To reduce the amount you use or do.", example: "I'm trying to cut down on screen time before bed so I can sleep better." },
                { term: "Get rid of", def: "To throw away or remove something you don't want.", example: "I need to get rid of all the clothes in my closet that don't fit me anymore." },
                { term: "Run out of", def: "To use everything so there is nothing left.", example: "I couldn't finish printing my history essay because we ran out of ink." },
                { term: "Come up with", def: "To think of a plan, idea, or solution.", example: "We need to come up with a brilliant idea for the school talent show." },
                { term: "Speed up", def: "To go faster or make something happen faster.", example: "We have to speed up our pace if we want to finish this group project by Friday." }
            ]
        };

        const getThemeColors = (tab) => {
            switch(tab) {
                case 'idioms': return { bgFrom: 'from-rose-500', bgTo: 'to-orange-400', borderTop: 'border-rose-500', text: 'text-rose-500', lightText: 'text-rose-100', lightBg: 'bg-rose-400' };
                case 'wordFamilies': return { bgFrom: 'from-violet-600', bgTo: 'to-fuchsia-500', borderTop: 'border-violet-500', text: 'text-violet-500', lightText: 'text-violet-100', lightBg: 'bg-violet-400' };
                case 'phrasalVerbs': return { bgFrom: 'from-emerald-600', bgTo: 'to-teal-400', borderTop: 'border-emerald-500', text: 'text-emerald-600', lightText: 'text-emerald-100', lightBg: 'bg-emerald-400' };
                default: return { bgFrom: 'from-blue-600', bgTo: 'to-cyan-500', borderTop: 'border-blue-500', text: 'text-blue-500', lightText: 'text-blue-100', lightBg: 'bg-blue-400' };
            }
        };

        const Flashcard = ({ term, def, example, example1, example2, isFocusMode, activeTab }) => {
            const [flipped, setFlipped] = useState(false);
            const theme = getThemeColors(activeTab);

            useEffect(() => { setFlipped(false); }, [term]);

            const sizeClasses = isFocusMode ? "focus-card" : "grid-card";
            const termSize = isFocusMode ? "text-5xl sm:text-7xl mb-6" : "text-2xl mb-2";
            const defSize = isFocusMode ? "text-3xl mb-6" : "text-lg mb-3";
            const exampleSize = isFocusMode ? "text-2xl" : "text-sm";
            const padding = isFocusMode ? "p-10" : "p-6";

            return (
                <div className={`perspective-1000 w-full ${sizeClasses} cursor-pointer group`} onClick={() => setFlipped(!flipped)}>
                    <div className={`flip-inner relative w-full h-full transform-style-3d ${flipped ? 'rotate-y-180' : ''}`}>
                        <div className={`absolute w-full h-full backface-hidden bg-gradient-front rounded-2xl shadow-md border-t-4 ${theme.borderTop} flex flex-col items-center justify-center ${padding} text-center group-hover:shadow-xl transition-shadow`}>
                            <h3 className={`font-extrabold text-slate-800 ${termSize}`}>{term}</h3>
                            <div className={`absolute bottom-6 flex items-center ${theme.text} animate-pulse`}>
                                <i className="fas fa-sync-alt mr-2"></i>
                                <span className={isFocusMode ? "text-xl font-bold" : "text-sm font-bold"}>Tap to Reveal</span>
                            </div>
                        </div>
                        <div className={`absolute w-full h-full backface-hidden bg-gradient-to-br ${theme.bgFrom} ${theme.bgTo} rotate-y-180 rounded-2xl shadow-xl flex flex-col items-center justify-center ${padding} text-center text-white`}>
                            <h4 className={`font-bold ${theme.lightText} uppercase tracking-wider mb-2 ${isFocusMode ? 'text-xl' : 'text-xs'}`}>Definition</h4>
                            <p className={`font-medium ${defSize}`}>{def}</p>
                            <div className={`w-16 h-1 ${theme.lightBg} rounded my-2 opacity-50`}></div>
                            <h4 className={`font-bold ${theme.lightText} uppercase tracking-wider mt-2 mb-2 ${isFocusMode ? 'text-xl' : 'text-xs'}`}>Example</h4>
                            {example ? (
                                <p className={`font-light italic text-white ${exampleSize}`}>"{example}"</p>
                            ) : (
                                <div className="space-y-3 w-full text-left px-4">
                                    <p className={`font-light italic text-white ${exampleSize}`}><span className={`font-bold ${theme.lightText}`}>Adj:</span> "{example1}"</p>
                                    <p className={`font-light italic text-white ${exampleSize}`}><span className={`font-bold ${theme.lightText}`}>Noun:</span> "{example2}"</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const WordNetworkBuilder = () => {
             const [activeMethod, setActiveMethod] = useState('mindMap');
             const [selectedWord, setSelectedWord] = useState('');
             const [selectedFrayerWord, setSelectedFrayerWord] = useState('Kill off');
             
             const mindMapWords = ["dispose of", "significant", "gray area", "feeling blue"];
             
             const mindMapData = {
                 "dispose of": {
                     synonyms: ["throw away", "get rid of", "discard", "bin"],
                     objects: ["waste", "trash", "batteries", "chemicals"],
                     context: ["recycling", "environment", "pollution"]
                 },
                 "significant": {
                     synonyms: ["important", "major", "meaningful", "substantial"],
                     collocations: ["impact", "change", "difference", "amount"],
                     context: ["science", "statistics", "history"]
                 },
                 "gray area": {
                      synonyms: ["unclear", "ambiguous", "uncertainty"],
                      related: ["rules", "ethics", "law", "boundaries"],
                      context: ["debates", "school rules", "internet usage"]
                 },
                 "feeling blue": {
                      synonyms: ["sad", "depressed", "down", "unhappy"],
                      causes: ["bad news", "weather", "loneliness", "failure"],
                      cures: ["friends", "pizza", "music", "exercise"]
                 }
             };

             const collocationData = [
                 { root: "Break", collocations: ["down (decompose)", "the rules", "a promise", "a habit", "the ice", "the law"], color: "blue" },
                 { root: "Strong", collocations: ["possibility", "evidence", "opinion", "coffee", "accent", "influence"], color: "rose" },
                 { root: "Run", collocations: ["out of (time/money)", "a business", "a risk", "late", "into (someone)", "errands"], color: "emerald" },
                 { root: "Significant", collocations: ["amount", "number", "difference", "impact", "contribution", "increase"], color: "violet" },
                 { root: "Prior", collocations: ["notice", "experience", "arrangement", "knowledge", "consent", "engagement"], color: "amber" },
                 { root: "Thick", collocations: ["fog", "smoke", "accent", "hair", "skin", "forest"], color: "slate" },
                 { root: "Sick", collocations: ["and tired", "leave", "pay", "note", "day", "of (something)"], color: "fuchsia" },
                 { root: "Creative", collocations: ["writing", "thinking", "process", "control", "ideas", "director"], color: "teal" },
             ];

             const frayerData = {
                 "Kill off": {
                     word: "Kill off",
                     definition: "To destroy a whole species or population completely.",
                     characteristics: ["Usually referring to animals/plants", "Implies a large scale", "Often caused by pollution or disease"],
                     examples: ["Chemical pollution in the river could completely kill off the local fish.", "The use of pesticides is killing off the bee population."],
                     nonExamples: ["Saving an endangered species", "A single animal dying naturally", "Protecting a habitat"]
                 },
                 "Get rid of": {
                     word: "Get rid of",
                     definition: "To throw away, sell, or destroy something you do not want anymore.",
                     characteristics: ["Informal and common", "Implies wanting something gone", "Can be objects or abstract things"],
                     examples: ["I need to get rid of these old clothes.", "We finally got rid of the mice in the basement."],
                     nonExamples: ["Keeping something", "Collecting items", "Holding onto a memory"]
                 },
                 "Dispose of": {
                     word: "Dispose of",
                     definition: "To throw away or get rid of something, often in a careful or responsible way.",
                     characteristics: ["More formal than 'get rid of'", "Often relates to hazardous materials or waste", "Implies a proper procedure"],
                     examples: ["How should we properly dispose of these old batteries?", "The company was fined for illegally disposing of toxic waste."],
                     nonExamples: ["Littering", "Hoarding", "Keeping something"]
                 }
             };

             const currentFrayerData = frayerData[selectedFrayerWord];

             return (
                 <div className="max-w-4xl mx-auto">
                     <div className="bg-white rounded-2xl shadow-lg p-8 mb-8 border-t-4 border-indigo-500">
                         <h2 className="text-3xl font-bold text-slate-800 mb-4"><i className="fas fa-project-diagram text-indigo-500 mr-3"></i>Build Your Word Network</h2>
                         <p className="text-slate-600 mb-6">Connect new vocabulary to words you already know to build a powerful semantic network.</p>
                         
                         <div className="flex flex-wrap gap-4 mb-8 justify-center">
                             <button onClick={() => setActiveMethod('mindMap')} className={`px-6 py-3 rounded-lg font-bold transition-all ${activeMethod === 'mindMap' ? 'bg-indigo-600 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>1. Mind Map</button>
                             <button onClick={() => setActiveMethod('collocations')} className={`px-6 py-3 rounded-lg font-bold transition-all ${activeMethod === 'collocations' ? 'bg-indigo-600 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>2. Collocations</button>
                             <button onClick={() => setActiveMethod('frayer')} className={`px-6 py-3 rounded-lg font-bold transition-all ${activeMethod === 'frayer' ? 'bg-indigo-600 text-white shadow-md transform scale-105' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>3. Frayer Model</button>
                         </div>

                         {/* Mind Map View */}
                         {activeMethod === 'mindMap' && (
                             <div className="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100 animate-fade-in">
                                 <h3 className="text-xl font-bold text-indigo-800 mb-4">The Brain Web Method</h3>
                                 <div className="flex gap-2 mb-6 flex-wrap">
                                     {mindMapWords.map(w => (
                                         <button key={w} onClick={() => setSelectedWord(w)} className={`px-4 py-2 rounded-full font-semibold border ${selectedWord === w ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-100'}`}>
                                             {w}
                                         </button>
                                     ))}
                                 </div>
                                 
                                 {selectedWord && mindMapData[selectedWord] && (
                                     <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8">
                                         <div className="bg-white p-4 rounded-lg shadow-sm border border-rose-200 text-center">
                                             <h4 className="font-bold text-rose-500 uppercase tracking-wider text-xs mb-3">Synonyms</h4>
                                             <ul className="space-y-2">
                                                 {(mindMapData[selectedWord].synonyms || []).map((s, i) => <li key={i} className="bg-rose-50 p-2 rounded text-slate-800 font-medium text-sm">{s}</li>)}
                                             </ul>
                                         </div>
                                         <div className="bg-gradient-to-br from-indigo-500 to-purple-600 p-4 rounded-xl shadow-lg flex items-center justify-center transform scale-105 z-10 border-4 border-white">
                                              <h3 className="text-2xl font-black text-white text-center">{selectedWord}</h3>
                                         </div>
                                         <div className="bg-white p-4 rounded-lg shadow-sm border border-emerald-200 text-center">
                                              <h4 className="font-bold text-emerald-600 uppercase tracking-wider text-xs mb-3">Context / Objects</h4>
                                              <ul className="space-y-2">
                                                  {(mindMapData[selectedWord].objects || mindMapData[selectedWord].context || []).map((s, i) => <li key={i} className="bg-emerald-50 p-2 rounded text-slate-800 font-medium text-sm">{s}</li>)}
                                              </ul>
                                         </div>
                                     </div>
                                 )}
                             </div>
                         )}

                         {/* Collocations View */}
                         {activeMethod === 'collocations' && (
                             <div className="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100 animate-fade-in">
                                  <h3 className="text-xl font-bold text-indigo-800 mb-6">Collocation Grouping</h3>
                                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                      {collocationData.map((data, index) => (
                                          <div key={index} className={`bg-white rounded-lg shadow-sm border-t-4 border-${data.color}-500 overflow-hidden`}>
                                              <div className={`bg-${data.color}-50 text-${data.color}-800 font-bold p-2 text-center text-md border-b border-${data.color}-100`}>{data.root} + ...</div>
                                              <ul className="p-3 space-y-2 text-sm">
                                                  {data.collocations.map((c, i) => (
                                                      <li key={i} className="flex items-center text-slate-700 font-medium">
                                                          <i className={`fas fa-circle text-[8px] text-${data.color}-400 mr-2`}></i> {data.root.toLowerCase()} {c}
                                                      </li>
                                                  ))}
                                              </ul>
                                          </div>
                                      ))}
                                  </div>
                             </div>
                         )}

                         {/* Frayer Model View */}
                         {activeMethod === 'frayer' && (
                              <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 animate-fade-in">
                                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
                                      <div>
                                          <h3 className="text-xl font-bold text-slate-800 mb-1">The Frayer Model</h3>
                                          <p className="text-slate-500 text-sm">Select a word below to see its breakdown.</p>
                                      </div>
                                      <select 
                                          value={selectedFrayerWord} 
                                          onChange={(e) => setSelectedFrayerWord(e.target.value)}
                                          className="mt-4 md:mt-0 p-2 rounded-lg border-2 border-indigo-300 bg-white text-indigo-800 font-bold shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                      >
                                          {Object.keys(frayerData).map(word => (
                                              <option key={word} value={word}>{word}</option>
                                          ))}
                                      </select>
                                  </div>
                                  
                                  {currentFrayerData && (
                                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-3xl mx-auto relative mt-8">
                                          {/* Definition: Blue */}
                                          <div className="bg-sky-50 p-5 md:rounded-tl-3xl border border-sky-200 shadow-sm relative z-0">
                                               <h4 className="font-bold text-sky-700 mb-2 uppercase text-xs tracking-wider"><i className="fas fa-book mr-1"></i> Definition</h4>
                                               <p className="text-sky-900 font-medium">{currentFrayerData.definition}</p>
                                          </div>
                                          
                                          {/* Characteristics: Purple */}
                                          <div className="bg-purple-50 p-5 md:rounded-tr-3xl border border-purple-200 shadow-sm relative z-0">
                                               <h4 className="font-bold text-purple-700 mb-2 uppercase text-xs tracking-wider"><i className="fas fa-list-ul mr-1"></i> Characteristics</h4>
                                               <ul className="list-disc list-inside text-purple-900 space-y-1 text-sm font-medium">
                                                   {(currentFrayerData.characteristics || []).map((c, i) => <li key={i}>{c}</li>)}
                                               </ul>
                                          </div>
                                          
                                          {/* Center target word */}
                                          <div className="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-800 text-white font-black text-xl px-8 py-4 rounded-full shadow-xl z-10 border-4 border-white items-center justify-center text-center tracking-wide">
                                              {currentFrayerData.word}
                                          </div>

                                          {/* Examples: Green */}
                                          <div className="bg-emerald-50 p-5 md:rounded-bl-3xl border border-emerald-200 shadow-sm relative z-0">
                                               <h4 className="font-bold text-emerald-700 mb-2 uppercase text-xs tracking-wider"><i className="fas fa-check-circle mr-1"></i> Examples</h4>
                                               <ul className="list-disc list-inside text-emerald-900 space-y-2 text-sm italic">
                                                   {(currentFrayerData.examples || []).map((c, i) => <li key={i}>{c}</li>)}
                                               </ul>
                                          </div>
                                          
                                          {/* Non-Examples: Red */}
                                          <div className="bg-rose-50 p-5 md:rounded-br-3xl border border-rose-200 shadow-sm relative z-0">
                                               <h4 className="font-bold text-rose-700 mb-2 uppercase text-xs tracking-wider"><i className="fas fa-times-circle mr-1"></i> Non-Examples</h4>
                                                <ul className="list-disc list-inside text-rose-900 space-y-1 text-sm font-medium">
                                                   {(currentFrayerData.nonExamples || []).map((c, i) => <li key={i}>{c}</li>)}
                                               </ul>
                                          </div>
                                      </div>
                                  )}
                              </div>
                         )}
                     </div>
                 </div>
             );
        };

        const Quiz = () => {
            const [questions, setQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [quizStarted, setQuizStarted] = useState(false);

            const startQuiz = () => {
                // Shuffle all 30 questions
                const shuffled = [...quizQuestionsData].sort(() => 0.5 - Math.random());
                
                // Shuffle options inside each question to prevent patterns
                const randomizedOptionsQuestions = shuffled.map(q => {
                    return {
                        ...q,
                        options: [...q.options].sort(() => 0.5 - Math.random())
                    }
                });

                setQuestions(randomizedOptionsQuestions);
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelectedAnswer(null);
                setQuizStarted(true);
            };

            const handleAnswer = (option) => {
                if (selectedAnswer) return; 
                setSelectedAnswer(option);
                if (option === questions[currentQ].correct) {
                    setScore(score + 1);
                }
            };

            const nextQuestion = () => {
                if (currentQ + 1 < questions.length) {
                    setCurrentQ(currentQ + 1);
                    setSelectedAnswer(null);
                } else {
                    setShowResult(true);
                }
            };

            if (!quizStarted) {
                return (
                    <div className="bg-white rounded-2xl shadow-lg p-10 text-center max-w-2xl mx-auto">
                        <i className="fas fa-brain text-6xl text-blue-500 mb-6"></i>
                        <h2 className="text-3xl font-bold text-slate-800 mb-4">Vocabulary Challenge</h2>
                        <p className="text-slate-600 mb-8 text-lg">Test your knowledge! You will face <strong>30 situational questions</strong> designed to test your understanding of Unit 7 idioms, word families, and environment verbs in context.</p>
                        <button onClick={startQuiz} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-xl text-xl shadow-md transition transform hover:scale-105">
                            Start 30-Question Quiz
                        </button>
                    </div>
                );
            }

            if (showResult) {
                const percentage = (score / questions.length) * 100;
                let message = "";
                if (percentage >= 90) message = "Outstanding! You've mastered this unit completely.";
                else if (percentage >= 70) message = "Great job! You know these situations well.";
                else if (percentage >= 50) message = "Good effort, but keep practicing the idioms.";
                else message = "Time to review the flashcards again!";

                return (
                    <div className="bg-white rounded-2xl shadow-lg p-10 text-center max-w-2xl mx-auto">
                        <i className={`fas fa-trophy text-6xl mb-6 ${percentage >= 70 ? 'text-yellow-400' : 'text-slate-300'}`}></i>
                        <h2 className="text-4xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                        <p className="text-xl text-slate-600 mb-6">{message}</p>
                        <div className="text-5xl font-extrabold text-blue-600 mb-8">{score} / {questions.length}</div>
                        <button onClick={startQuiz} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition mr-4">
                            Retake Quiz
                        </button>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="max-w-3xl mx-auto">
                    {/* Progress Bar */}
                    <div className="mb-6 flex justify-between items-center">
                        <span className="text-sm font-bold text-slate-500 uppercase tracking-wider">Question {currentQ + 1} of {questions.length}</span>
                        <span className="text-sm font-bold text-blue-500 uppercase tracking-wider">Score: {score}</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2.5 mb-8">
                        <div className="bg-blue-600 h-2.5 rounded-full transition-all duration-500" style={{ width: `${((currentQ + 1) / questions.length) * 100}%` }}></div>
                    </div>

                    {/* Question Card */}
                    <div className="bg-white rounded-2xl shadow-lg p-8 mb-6 border-t-4 border-blue-500">
                        <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Fill in the blank:</h3>
                        <p className="text-2xl font-semibold text-slate-800 leading-relaxed">"{q.situation}"</p>
                    </div>

                    {/* Options */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                        {q.options.map((option, index) => {
                            let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-blue-500 hover:bg-blue-50";
                            
                            if (selectedAnswer) {
                                if (option === q.correct) {
                                    btnStyle = "bg-green-500 border-green-600 text-white shadow-md"; // Correct answer highlights green
                                } else if (option === selectedAnswer) {
                                    btnStyle = "bg-red-500 border-red-600 text-white shadow-md"; // Wrong selection highlights red
                                } else {
                                    btnStyle = "bg-slate-50 border-slate-200 text-slate-400 cursor-not-allowed opacity-60"; // Others fade out
                                }
                            }

                            return (
                                <button 
                                    key={index}
                                    onClick={() => handleAnswer(option)}
                                    disabled={!!selectedAnswer}
                                    className={`p-4 rounded-xl font-bold text-lg transition-all ${btnStyle}`}
                                >
                                    {option}
                                </button>
                            );
                        })}
                    </div>

                    {/* Feedback & Next Button */}
                    {selectedAnswer && (
                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-6 flex flex-col sm:flex-row justify-between items-center animate-fade-in">
                            <div className="mb-4 sm:mb-0 max-w-md">
                                <h4 className="font-bold text-blue-800 text-sm uppercase tracking-wider mb-1">Learning Note:</h4>
                                <p className="font-medium text-blue-900">{q.feedback}</p>
                            </div>
                            <button 
                                onClick={nextQuestion}
                                className="whitespace-nowrap bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow transition ml-0 sm:ml-4"
                            >
                                {currentQ + 1 === questions.length ? 'See Results' : 'Next Question'} <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('idioms');
            const [viewMode, setViewMode] = useState('focus'); 
            const [currentIndex, setCurrentIndex] = useState(0);

            const activeData = vocabData[activeTab] || [];

            useEffect(() => { setCurrentIndex(0); }, [activeTab]);

            const nextCard = () => setCurrentIndex((prev) => (prev + 1) % activeData.length);
            const prevCard = () => setCurrentIndex((prev) => (prev - 1 + activeData.length) % activeData.length);

            return (
                <div className="min-h-screen pb-12 font-sans text-slate-800">
                    <header className="bg-white shadow-sm pt-10 pb-6 mb-8 border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
                            <div className="text-center md:text-left mb-4 md:mb-0">
                                <h1 className="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-500 mb-1">
                                    Unit 7: Why do colors matter?
                                </h1>
                                <p className="text-lg text-slate-500 font-medium">Interactive Vocabulary Showcase</p>
                            </div>
                            
                            {/* Hide View Toggles if in Quiz or Network Tab */}
                            {(activeTab !== 'quiz' && activeTab !== 'network') && (
                                <div className="flex bg-slate-100 p-1 rounded-lg">
                                    <button onClick={() => setViewMode('focus')} className={`px-4 py-2 rounded-md font-semibold text-sm transition-colors ${viewMode === 'focus' ? 'bg-white text-slate-800 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                        <i className="fas fa-chalkboard mr-2"></i> Board View
                                    </button>
                                    <button onClick={() => setViewMode('grid')} className={`px-4 py-2 rounded-md font-semibold text-sm transition-colors ${viewMode === 'grid' ? 'bg-white text-slate-800 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                        <i className="fas fa-th mr-2"></i> Grid View
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4">
                        {/* Category Navigation */}
                        <div className="flex flex-wrap justify-center mb-10 gap-3">
                            <button onClick={() => setActiveTab('idioms')} className={`px-5 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'idioms' ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-500 hover:bg-slate-50 shadow-sm'}`}>
                                <span className="text-xl mr-2">🎨</span> Idioms
                            </button>
                            <button onClick={() => setActiveTab('wordFamilies')} className={`px-5 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'wordFamilies' ? 'bg-purple-50 border-purple-500 text-purple-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-500 hover:bg-slate-50 shadow-sm'}`}>
                                <span className="text-xl mr-2">🔗</span> Word Families
                            </button>
                            <button onClick={() => setActiveTab('phrasalVerbs')} className={`px-5 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'phrasalVerbs' ? 'bg-teal-50 border-teal-500 text-teal-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-500 hover:bg-slate-50 shadow-sm'}`}>
                                <span className="text-xl mr-2">🌍</span> Environment Verbs
                            </button>
                            <div className="w-px bg-slate-300 mx-2 hidden sm:block"></div>
                             <button onClick={() => setActiveTab('network')} className={`px-6 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'network' ? 'bg-indigo-50 border-indigo-500 text-indigo-700 shadow-md transform scale-105' : 'bg-slate-100 border-transparent text-slate-600 hover:bg-slate-200 shadow-sm'}`}>
                                <i className="fas fa-project-diagram mr-2"></i> Word Networks
                            </button>
                            <button onClick={() => setActiveTab('quiz')} className={`px-6 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'quiz' ? 'bg-slate-800 border-slate-800 text-white shadow-md transform scale-105' : 'bg-slate-800 border-transparent text-white hover:bg-slate-700 shadow-md'}`}>
                                <i className="fas fa-brain mr-2"></i> Practice Quiz
                            </button>
                        </div>

                        {/* Content Area */}
                        {activeTab === 'network' ? (
                            <WordNetworkBuilder />
                        ) : activeTab === 'quiz' ? (
                            <Quiz /> 
                        ) : viewMode === 'grid' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {activeData.map((item, index) => (
                                    <Flashcard key={`${activeTab}-${index}`} {...item} isFocusMode={false} activeTab={activeTab} />
                                ))}
                            </div>
                        ) : (
                            <div className="relative pt-4">
                                <div className="text-center mb-4 text-slate-500 font-bold tracking-widest uppercase text-sm">
                                    Card {currentIndex + 1} of {activeData.length}
                                </div>
                                <div className="flex items-center justify-between gap-4">
                                    <button onClick={prevCard} className="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center text-slate-600 hover:bg-slate-50 transition transform hover:-translate-x-1 focus:outline-none focus:ring-4 focus:ring-slate-200">
                                        <i className="fas fa-chevron-left text-2xl"></i>
                                    </button>
                                    <div className="flex-grow">
                                        <Flashcard key={`${activeTab}-${currentIndex}`} {...activeData[currentIndex]} isFocusMode={true} activeTab={activeTab} />
                                    </div>
                                    <button onClick={nextCard} className="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center text-slate-600 hover:bg-slate-50 transition transform hover:translate-x-1 focus:outline-none focus:ring-4 focus:ring-slate-200">
                                        <i className="fas fa-chevron-right text-2xl"></i>
                                    </button>
                                </div>
                                <p className="text-center mt-8 text-slate-400">
                                    Use the arrows to navigate. Click the card to reveal the definition and example sentence.
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
