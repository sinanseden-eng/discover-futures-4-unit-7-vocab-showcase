             const frayerData = {
                 // PHRASAL VERBS (11)
                 "Kill off": {

             const networkQuestionsData = [
                 // Synonyms / Substitutions
                 { prompt: "Which phrase is the closest synonym in the network for 'accumulate' or 'gather'?", options: ["build up", "break down", "dispose of", "go through"], correct: "build up", feedback: "Synonym Network: 'Build up', 'accumulate', and 'gather' are part of the same semantic web." },

                 { prompt: "Which idiom belongs in the category of 'unregulated trade and illegality'?", options: ["on the black market", "a gray area", "see red", "kill off"], correct: "on the black market", feedback: "Context Web: The 'black market' refers to illegal economic activity." },

                 { prompt: "Which root word forms a strong collocation with 'impact', 'difference', and 'contribution'?", options: ["significant", "strong", "thick", "possible"], correct: "significant", feedback: "Collocation: We often say a 'significant impact' or 'significant difference'." },
                 { prompt: "Which root word naturally pairs with 'evidence', 'coffee', and 'influence'?", options: ["strong", "significant", "prior", "creative"], correct: "strong", feedback: "Collocation: 'Strong coffee' and 'strong evidence' are deeply ingrained collocations." },
                 { prompt: "Which root word naturally collocates with 'fog', 'accent', and 'skin'?", options: ["thick", "strong", "sick", "creative"], correct: "thick", feedback: "Collocation: 'Thick fog' and 'thick accent' are common adjective-noun pairs." },
                 { prompt: "Which root word frequently pairs with 'notice', 'experience', and 'engagement'?", options: ["prior", "possible", "significant", "thick"], correct: "prior", feedback: "Collocation: We often speak of 'prior notice' before an event." },
                 { prompt: "Which root word forms collocations like '___ leave', '___ pay', and '___ note'?", options: ["sick", "prior", "strong", "creative"], correct: "sick", feedback: "Collocation: 'Sick leave' and 'sick pay' are standard workplace terms." },

                 { prompt: "According to a Frayer Model, which would be a 'non-example' of 'a gray area'?", options: ["Strict, black-and-white rules", "An ambiguous law", "An unclear boundary", "An undefined situation"], correct: "Strict, black-and-white rules", feedback: "Frayer Model: Strict rules are the opposite (non-example) of a gray area." },

                 { prompt: "'Possible' maps to 'Possibility'. What does 'Significant' map to?", options: ["Significance", "Significantly", "Signify", "Signification"], correct: "Significance", feedback: "Word Families: The noun form of 'significant' is 'significance'." },
                 { prompt: "Which noun completes the web for something of great importance before everything else? 'Top ___'", options: ["priority", "possibility", "significance", "creativity"], correct: "priority", feedback: "Context Web: A 'top priority' is your most important task." },
                 // Advanced Concept Mapping
                 { prompt: "Which phrasal verb fits the concept web: 'Plastics, oceans, decompose, hundreds of years'?", options: ["break down", "build up", "dispose of", "kill off"], correct: "break down", feedback: "Concept Map: 'Break down' is the process of decomposition." },
                 { prompt: "Which phrasal verb fits the concept web: 'Trash, hazardous waste, recycling bins, responsible removal'?", options: ["dispose of", "get rid of", "go through", "run out of"], correct: "dispose of", feedback: "Concept Map: 'Dispose of' is the formal term for responsible waste removal." },

                 { prompt: "Which phrase conceptually maps to 'lingering, waiting, and remaining in a place'?", options: ["stick around", "build up", "speed up", "come up with"], correct: "stick around", feedback: "Concept Map: 'Sticking around' means you aren't leaving yet." },
                 { prompt: "Which informal term conceptually maps to 'throwing away old clothes, catching mice, unwanted items'?", options: ["get rid of", "dispose of", "go through", "break down"], correct: "get rid of", feedback: "Concept Map: 'Get rid of' is the most common informal way to say remove/discard." },
                 { prompt: "Which phrase conceptually means 'to destroy a whole population', often referring to nature?", options: ["kill off", "dispose of", "break down", "get rid of"], correct: "kill off", feedback: "Concept Map: 'Kill off' implies destruction on a mass scale." },
                 { prompt: "Which idiom refers to an experience that makes you 'grip tightly in fear'?", options: ["a white-knuckle ride", "seeing red", "feeling blue", "a gray area"], correct: "a white-knuckle ride", feedback: "Concept Map: White knuckles literally happen when you grip something hard out of fear." },
                 { prompt: "Which phrase implies 'experiencing a difficult emotional situation' or 'using a lot of a physical item'?", options: ["go through", "break down", "cut down on", "stick around"], correct: "go through", feedback: "Concept Map: 'Go through' has both a physical (consuming) and emotional (experiencing) network." }
             ];

             const startPracticeQuiz = () => {
                 const shuffled = [...networkQuestionsData].sort(() => 0.5 - Math.random());

                         {/* Mind Map View */}
                         {activeMethod === 'mindMap' && (

                                 <div className="flex gap-2 mb-6 flex-wrap">
                                     {mindMapWords.map(w => (
                                         <button key={w} onClick={() => setSelectedWord(w)} className={`px-4 py-2 rounded-full font-semibold border ${selectedWord === w ? 'bg-indigo-500 text-white border-indigo-600' : 'bg-white text-indigo-600 border-indigo-200 hover:bg-indigo-100'}`}>
                                             {w}
                                         </button>
                                     ))}
                                 </div>
                                 
                                 {selectedWord && mindMapData[selectedWord] && (
                                     <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8">
                                         <div className="bg-white p-4 rounded-lg shadow-sm border border-rose-200 text-center">
                                             <h4 className="font-bold text-rose-500 uppercase tracking-wider text-xs mb-3">Synonyms</h4>
                                             <ul className="space-y-2">
                                                 {(mindMapData[selectedWord].synonyms || []).map((s, i) => <li key={i} className="bg-rose-50 p-2 rounded text-slate-800 font-medium text-sm">{s}</li>)}
                                             </ul>

                                         <div className="bg-gradient-to-br from-indigo-500 to-purple-600 p-4 rounded-xl shadow-lg flex items-center justify-center transform scale-105 z-10 border-4 border-white">
                                              <h3 className="text-2xl font-black text-white text-center">{selectedWord}</h3>

                                              </ul>
                                         </div>

                             </div>

                         {/* Collocations View */}
                         {activeMethod === 'collocations' && (

                                  <h3 className="text-xl font-bold text-indigo-800 mb-6">Collocation Grouping</h3>
                                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                      {collocationData.map((data, index) => (

                                              <div className={`bg-${data.color}-50 text-${data.color}-800 font-bold p-2 text-center text-md border-b border-${data.color}-100`}>{data.root} + ...</div>

                                                  {data.collocations.map((c, i) => (

                                                          <i className={`fas fa-circle text-[8px] text-${data.color}-400 mr-2`}></i> {data.root.toLowerCase()} {c}
                                                      </li>
                                                  ))}
                                              </ul>
                                          </div>
                                      ))}
                                  </div>
                             </div>
                         )}

                         {/* Frayer Model View */}
                         {activeMethod === 'frayer' && (

                                      </div>
                                      <select

                                          {Object.keys(frayerData).map(word => (
                                              <option key={word} value={word}>{word}</option>

                                  </div>
                                  
                                  {currentFrayerData && (

                                               <ul className="list-disc list-inside text-purple-900 space-y-1 text-sm font-medium">
                                                   {(currentFrayerData.characteristics || []).map((c, i) => <li key={i}>{c}</li>)}
                                               </ul>
                                          </div>
                                          
                                          {/* Center target word */}
                                          <div className="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-800 text-white font-black text-xl px-8 py-4 rounded-full shadow-xl z-10 border-4 border-white items-center justify-center text-center tracking-wide">
                                              {currentFrayerData.word}
                                          </div>

                                          {/* Examples: Green */}
                                          <div className="bg-emerald-50 p-5 md:rounded-bl-3xl border border-emerald-200 shadow-sm relative z-0">
                                               <h4 className="font-bold text-emerald-700 mb-2 uppercase text-xs tracking-wider"><i className="fas fa-check-circle mr-1"></i> Examples</h4>
                                               <ul className="list-disc list-inside text-emerald-900 space-y-2 text-sm italic">
                                                   {(currentFrayerData.examples || []).map((c, i) => <li key={i}>{c}</li>)}
                                               </ul>
                                          </div>
                                          
                                          {/* Non-Examples: Red */}
                                          <div className="bg-rose-50 p-5 md:rounded-br-3xl border border-rose-200 shadow-sm relative z-0">
                                               <h4 className="font-bold text-rose-700 mb-2 uppercase text-xs tracking-wider"><i className="fas fa-times-circle mr-1"></i> Non-Examples</h4>
                                                <ul className="list-disc list-inside text-rose-900 space-y-1 text-sm font-medium">
                                                   {(currentFrayerData.nonExamples || []).map((c, i) => <li key={i}>{c}</li>)}
                                               </ul>
                                          </div>
                                      </div>
                                  )}
                              </div>
                         )}

                         {/* Network Practice Quiz View */}
                         {activeMethod === 'practice' && (
                             <div className="bg-indigo-50/50 p-6 rounded-xl border border-indigo-200 animate-fade-in">
                                 {!pqStarted ? (
                                     <div className="text-center py-8">
                                         <i className="fas fa-dumbbell text-6xl text-indigo-400 mb-4"></i>
                                         <h3 className="text-2xl font-bold text-indigo-900 mb-4">Word Network Challenge</h3>
                                         <p className="text-slate-600 mb-8 max-w-lg mx-auto">
                                             Test your semantic network! You will face <strong>30 questions</strong> focusing on collocations, synonyms, antonyms, and word associations instead of just basic definitions.
                                         </p>
                                         <button onClick={startPracticeQuiz} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl text-lg shadow-md transition transform hover:scale-105">
                                             Start 30-Question Challenge
                                         </button>
                                     </div>
                                 ) : pqShowResult ? (
                                     <div className="text-center py-8">
                                         <i className={`fas fa-trophy text-6xl mb-4 ${pqScore >= 20 ? 'text-yellow-400' : 'text-slate-400'}`}></i>
                                         <h2 className="text-3xl font-bold text-slate-800 mb-2">Challenge Complete!</h2>
                                         <div className="text-5xl font-extrabold text-indigo-600 mb-6">{pqScore} / {pqQuestions.length}</div>
                                         <button onClick={startPracticeQuiz} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition">
                                             Retake Challenge
                                         </button>
                                     </div>
                                 ) : (
                                     <div className="max-w-2xl mx-auto">
                                         <div className="flex justify-between items-center mb-4">
                                             <span className="text-xs font-bold text-indigo-400 uppercase tracking-wider">Question {pqCurrent + 1} of {pqQuestions.length}</span>
                                             <span className="text-xs font-bold text-indigo-800 uppercase tracking-wider">Score: {pqScore}</span>
                                         </div>
                                         <div className="w-full bg-indigo-100 rounded-full h-2 mb-6">
                                             <div className="bg-indigo-500 h-2 rounded-full transition-all duration-300" style={{ width: `${((pqCurrent + 1) / pqQuestions.length) * 100}%` }}></div>
                                         </div>
                                         
                                         <h3 className="text-xl font-bold text-slate-800 mb-6">"{pqQuestions[pqCurrent].prompt}"</h3>
                                         
                                         <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                                             {pqQuestions[pqCurrent].options.map((opt, idx) => {
                                                 let btnStyle = "bg-white border-2 border-indigo-100 text-slate-700 hover:border-indigo-400";
                                                 if (pqSelectedAnswer) {
                                                     if (opt === pqQuestions[pqCurrent].correct) btnStyle = "bg-emerald-500 border-emerald-600 text-white";
                                                     else if (opt === pqSelectedAnswer) btnStyle = "bg-rose-500 border-rose-600 text-white";
                                                     else btnStyle = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                                                 }
                                                 return (
                                                     <button key={idx} onClick={() => handlePqAnswer(opt)} disabled={!!pqSelectedAnswer} className={`p-4 rounded-xl font-bold text-md transition-all ${btnStyle}`}>
                                                         {opt}
                                                     </button>
                                                 );
                                             })}
                                         </div>

                                         {pqSelectedAnswer && (
                                             <div className="bg-white border border-indigo-200 rounded-xl p-5 flex flex-col sm:flex-row justify-between items-center animate-fade-in shadow-sm">
                                                 <div className="mb-4 sm:mb-0 max-w-sm">
                                                     <h4 className="font-bold text-indigo-400 text-xs uppercase tracking-wider mb-1"><i className="fas fa-info-circle mr-1"></i> Network Note:</h4>
                                                     <p className="font-medium text-slate-700 text-sm">{pqQuestions[pqCurrent].feedback}</p>
                                                 </div>
                                                 <button onClick={nextPqQuestion} className="whitespace-nowrap bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg shadow transition ml-0 sm:ml-4">
                                                     {pqCurrent + 1 === pqQuestions.length ? 'Results' : 'Next'} <i className="fas fa-arrow-right ml-1"></i>
                                                 </button>
                                             </div>
                                         )}
                                     </div>
                                 )}
                             </div>
                         )}
                     </div>
                 </div>
             );
        };

        const Quiz = () => {
            const [questions, setQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [score, setScore] = useState(0);
            const [showResult, setShowResult] = useState(false);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [quizStarted, setQuizStarted] = useState(false);

            const quizQuestionsData = [
                { situation: "When my little brother deleted my 100-hour game save file, I started to ___.", correct: "see red", options: ["see red", "feel blue", "stick around", "break down"], feedback: "Idiom: To become very angry suddenly." },
                { situation: "My parents won't let me stay out past 10 PM, but 10:15 is kind of ___.", correct: "a gray area", options: ["a gray area", "a white-knuckle ride", "a priority", "a sickness"], feedback: "Idiom: An unclear situation where the rules aren't obvious." },
                { situation: "After her dog ran away, Sarah was ___ for weeks.", correct: "feeling blue", options: ["feeling blue", "seeing red", "green with envy", "creative"], feedback: "Idiom: Feeling sad or depressed." },
                { situation: "I couldn't get official tickets to the concert, so I had to buy them ___.", correct: "on the black market", options: ["on the black market", "in a gray area", "green with envy", "feeling blue"], feedback: "Idiom: Bought or sold illegally." },
                { situation: "When he showed up at school in a brand new sports car, all his friends were ___.", correct: "green with envy", options: ["green with envy", "feeling blue", "seeing red", "a white-knuckle ride"], feedback: "Idiom: Very jealous of someone else's success or belongings." },
                { situation: "That new horror movie was intense from start to finish; it was a total ___.", correct: "white-knuckle ride", options: ["white-knuckle ride", "gray area", "possibility", "priority"], feedback: "Idiom: A thrilling or terrifying experience." },
                { situation: "He didn't have the ___ to lift the heavy box by himself.", correct: "strength", options: ["strength", "strong", "thickness", "thick"], feedback: "Noun form of strong: Having physical or mental power." },
                { situation: "There is a strong ___ that it will snow tomorrow, so we might not have school.", correct: "possibility", options: ["possibility", "possible", "significance", "significant"], feedback: "Noun form of possible: A chance that something might happen." },
                { situation: "Finishing my homework is my top ___ right now; I can play video games later.", correct: "priority", options: ["priority", "prior", "possibility", "possible"], feedback: "Noun form of prior: Something that is more important than other things." },
                { situation: "We usually ___ a gallon of milk every two days in our house.", correct: "go through", options: ["go through", "run out of", "cut down on", "break down"], feedback: "Phrasal Verb: To use up a lot of something entirely." },
                { situation: "Please ___ your gum in the trash can, not under the desk!", correct: "dispose of", options: ["dispose of", "build up", "stick around", "come up with"], feedback: "Phrasal Verb: To throw away correctly." },
                { situation: "Plastic bottles take hundreds of years to ___ in a landfill.", correct: "break down", options: ["break down", "build up", "kill off", "speed up"], feedback: "Phrasal Verb: To separate into smaller parts or decompose." },
                { situation: "If you don't sweep the floor, the dust and hair will just ___ in the corners.", correct: "build up", options: ["build up", "break down", "dispose of", "run out of"], feedback: "Phrasal Verb: To increase or collect over time." },
                { situation: "I think I'll ___ after class to ask the teacher a few questions.", correct: "stick around", options: ["stick around", "go through", "run out of", "kill off"], feedback: "Phrasal Verb: To stay somewhere for a period of time." },
                { situation: "I need to ___ sugar because I've been eating way too much candy lately.", correct: "cut down on", options: ["cut down on", "speed up", "build up", "go through"], feedback: "Phrasal Verb: To reduce the amount you use or do." }
            ];

            const startQuiz = () => {
                const shuffled = [...quizQuestionsData].sort(() => 0.5 - Math.random()).slice(0, 15);
                const randomizedOptionsQuestions = shuffled.map(q => {
                    return { ...q, options: [...q.options].sort(() => 0.5 - Math.random()) }
                });
                setQuestions(randomizedOptionsQuestions);
                setCurrentQ(0);
                setScore(0);
                setShowResult(false);
                setSelectedAnswer(null);
                setQuizStarted(true);
            };

            const handleAnswer = (option) => {
                if (selectedAnswer) return; 
                setSelectedAnswer(option);
                if (option === questions[currentQ].correct) setScore(score + 1);
            };

            const nextQuestion = () => {
                if (currentQ + 1 < questions.length) {
                    setCurrentQ(currentQ + 1);
                    setSelectedAnswer(null);
                } else {
                    setShowResult(true);
                }
            };

            if (!quizStarted) {
                return (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center max-w-2xl mx-auto">
                        <i className="fas fa-brain text-6xl text-slate-800 mb-6"></i>
                        <h2 className="text-3xl font-bold text-slate-800 mb-4">Vocabulary Challenge</h2>
                        <p className="text-slate-600 mb-8 text-lg">Test your knowledge! You will face situational questions designed to test your understanding of Unit 7 vocabulary in context.</p>
                        <button onClick={startQuiz} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 px-10 rounded-xl text-xl shadow-md transition transform hover:scale-105">
                            Start Quiz
                        </button>
                    </div>
                );
            }

            if (showResult) {
                const percentage = (score / questions.length) * 100;
                let message = "";
                if (percentage >= 90) message = "Outstanding! You've mastered this unit completely.";
                else if (percentage >= 70) message = "Great job! You know these situations well.";
                else message = "Time to review the word networks again!";

                return (
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-10 text-center max-w-2xl mx-auto">

                        <h2 className="text-4xl font-bold text-slate-800 mb-2">Quiz Complete!</h2>
                        <p className="text-xl text-slate-600 mb-6">{message}</p>
                        <div className="text-5xl font-extrabold text-slate-800 mb-8">{score} / {questions.length}</div>
                        <button onClick={startQuiz} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl shadow-md transition mr-4">
                            Retake Quiz
                        </button>
                    </div>
                );
            }

            const q = questions[currentQ];

            return (
                <div className="max-w-3xl mx-auto">
                    <div className="mb-6 flex justify-between items-center">
                        <span className="text-sm font-bold text-slate-500 uppercase tracking-wider">Question {currentQ + 1} of {questions.length}</span>
                        <span className="text-sm font-bold text-slate-800 uppercase tracking-wider">Score: {score}</span>
                    </div>
                    <div className="w-full bg-slate-200 rounded-full h-2.5 mb-8">
                        <div className="bg-slate-800 h-2.5 rounded-full transition-all duration-500" style={{ width: `${((currentQ + 1) / questions.length) * 100}%` }}></div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm p-8 mb-6 border-t-4 border-slate-800">

                        <p className="text-2xl font-semibold text-slate-800 leading-relaxed">"{q.situation}"</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">

                            let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-slate-800 hover:bg-slate-50";
                            if (selectedAnswer) {
                                if (option === q.correct) btnStyle = "bg-emerald-500 border-emerald-600 text-white shadow-md"; 
                                else if (option === selectedAnswer) btnStyle = "bg-rose-500 border-rose-600 text-white shadow-md";
                                else btnStyle = "bg-slate-50 border-slate-200 text-slate-400 cursor-not-allowed opacity-60"; 
                            }
                            return (
                                <button key={index} onClick={() => handleAnswer(option)} disabled={!!selectedAnswer} className={`p-4 rounded-xl font-bold text-lg transition-all ${btnStyle}`}>
                                    {option}
                                </button>
                            );
                        })}
                    </div>
                    {selectedAnswer && (
                        <div className="bg-slate-100 border border-slate-300 rounded-xl p-6 flex flex-col sm:flex-row justify-between items-center animate-fade-in">
                            <div className="mb-4 sm:mb-0 max-w-md">
                                <h4 className="font-bold text-slate-600 text-sm uppercase tracking-wider mb-1">Learning Note:</h4>
                                <p className="font-medium text-slate-800">{q.feedback}</p>
                            </div>
                            <button onClick={nextQuestion} className="whitespace-nowrap bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-lg shadow transition ml-0 sm:ml-4">
                                {currentQ + 1 === questions.length ? 'See Results' : 'Next Question'} <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('idioms');
            const [viewMode, setViewMode] = useState('focus'); 
            const [currentIndex, setCurrentIndex] = useState(0);

            const activeData = vocabData[activeTab] || [];

            useEffect(() => { setCurrentIndex(0); }, [activeTab]);

            const nextCard = () => setCurrentIndex((prev) => (prev + 1) % activeData.length);
            const prevCard = () => setCurrentIndex((prev) => (prev - 1 + activeData.length) % activeData.length);

            return (
                <div className="min-h-screen pb-12 font-sans text-slate-800">
                    <header className="bg-white shadow-sm pt-10 pb-6 mb-8 border-b border-slate-200">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
                            <div className="text-center md:text-left mb-4 md:mb-0">
                                <h1 className="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-500 mb-1">
                                    Unit 7: Why do colors matter?
                                </h1>
                                <p className="text-lg text-slate-500 font-medium">Interactive Vocabulary Showcase</p>
                            </div>
                            
                            {/* Hide View Toggles if in Quiz or Network Tab */}
                            {(activeTab !== 'quiz' && activeTab !== 'network') && (
                                <div className="flex bg-slate-100 p-1 rounded-lg">
                                    <button onClick={() => setViewMode('focus')} className={`px-4 py-2 rounded-md font-semibold text-sm transition-colors ${viewMode === 'focus' ? 'bg-white text-slate-800 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                        <i className="fas fa-chalkboard mr-2"></i> Board View
                                    </button>
                                    <button onClick={() => setViewMode('grid')} className={`px-4 py-2 rounded-md font-semibold text-sm transition-colors ${viewMode === 'grid' ? 'bg-white text-slate-800 shadow' : 'text-slate-500 hover:text-slate-700'}`}>
                                        <i className="fas fa-th mr-2"></i> Grid View
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4">
                        {/* Category Navigation */}
                        <div className="flex flex-wrap justify-center mb-10 gap-3">
                            <button onClick={() => setActiveTab('idioms')} className={`px-5 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'idioms' ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-500 hover:bg-slate-50 shadow-sm'}`}>
                                <span className="text-xl mr-2">🎨</span> Idioms
                            </button>
                            <button onClick={() => setActiveTab('wordFamilies')} className={`px-5 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'wordFamilies' ? 'bg-purple-50 border-purple-500 text-purple-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-500 hover:bg-slate-50 shadow-sm'}`}>
                                <span className="text-xl mr-2">🔗</span> Word Families
                            </button>
                            <button onClick={() => setActiveTab('phrasalVerbs')} className={`px-5 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'phrasalVerbs' ? 'bg-teal-50 border-teal-500 text-teal-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-500 hover:bg-slate-50 shadow-sm'}`}>
                                <span className="text-xl mr-2">🌍</span> Environment Verbs
                            </button>
                            <div className="w-px bg-slate-300 mx-2 hidden sm:block"></div>
                             <button onClick={() => setActiveTab('network')} className={`px-6 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'network' ? 'bg-indigo-50 border-indigo-500 text-indigo-700 shadow-md transform scale-105' : 'bg-white border-transparent text-slate-600 hover:bg-slate-50 shadow-sm'}`}>
                                <i className="fas fa-project-diagram mr-2"></i> Word Networks
                            </button>
                            <button onClick={() => setActiveTab('quiz')} className={`px-6 py-3 rounded-xl font-bold transition-all border-2 flex items-center ${activeTab === 'quiz' ? 'bg-slate-800 border-slate-800 text-white shadow-md transform scale-105' : 'bg-slate-800 border-transparent text-white hover:bg-slate-700 shadow-md'}`}>
                                <i className="fas fa-brain mr-2"></i> Practice Quiz
                            </button>
                        </div>

                        {/* Content Area */}
                        {activeTab === 'network' ? (
                            <WordNetworkBuilder />
                        ) : activeTab === 'quiz' ? (
                            <Quiz /> 
                        ) : viewMode === 'grid' ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {activeData.map((item, index) => (
                                    <Flashcard key={`${activeTab}-${index}`} {...item} isFocusMode={false} activeTab={activeTab} />
                                ))}
                            </div>
                        ) : (
                            <div className="relative pt-4">
                                <div className="text-center mb-4 text-slate-500 font-bold tracking-widest uppercase text-sm">
                                    Card {currentIndex + 1} of {activeData.length}
                                </div>
                                <div className="flex items-center justify-between gap-4">
                                    <button onClick={prevCard} className="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center text-slate-600 hover:bg-slate-50 transition transform hover:-translate-x-1 focus:outline-none focus:ring-4 focus:ring-slate-200">
                                        <i className="fas fa-chevron-left text-2xl"></i>
                                    </button>
                                    <div className="flex-grow">
                                        <Flashcard key={`${activeTab}-${currentIndex}`} {...activeData[currentIndex]} isFocusMode={true} activeTab={activeTab} />
                                    </div>
                                    <button onClick={nextCard} className="w-14 h-14 rounded-full bg-white shadow-md flex items-center justify-center text-slate-600 hover:bg-slate-50 transition transform hover:translate-x-1 focus:outline-none focus:ring-4 focus:ring-slate-200">
                                        <i className="fas fa-chevron-right text-2xl"></i>
                                    </button>
                                </div>
                                <p className="text-center mt-8 text-slate-400">
                                    Use the arrows to navigate. Click the card to reveal the definition and example sentence.
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
